<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
  }
  .kutu {
    max-width: 600px;
    margin: 0 auto;
    background: #1e293b;
    border-radius: 16px;
    padding: 24px;
    border: 1px solid #334155;
  }
  h1 { color: #38bdf8; font-size: 22px; margin-bottom: 20px; text-align: center; }
  input, button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 15px;
    margin-bottom: 10px;
    font-family: inherit;
  }
  button {
    background: #38bdf8;
    color: #0f172a;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }
  button:active { opacity: 0.8; }
  button.ikincil { background: #334155; color: #e2e8f0; }
  .pc-kart {
    background: #0f172a;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
    border-left: 4px solid #38bdf8;
  }
  .pc-kart h3 { color: #38bdf8; margin-bottom: 12px; font-size: 16px; }
  .pc-kart label {
    font-size: 11px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 4px;
    margin-top: 8px;
  }
  .durum {
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    font-size: 14px;
    display: none;
  }
  .durum.ok { background: #14532d; color: #86efac; display: block; }
  .durum.hata { background: #7f1d1d; color: #fca5a5; display: block; }
  .gizli { display: none; }
  .bilgi {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 8px;
    line-height: 1.5;
    text-align: center;
  }
</style>
</head>
<body>

<div class="kutu">

  <!-- GİRİŞ EKRANI -->
  <div id="giris">
    <h1>🔒 Admin Girişi</h1>
    <input type="password" id="sifreGiris" placeholder="Şifre" />
    <button onclick="girisYap()">Giriş Yap</button>
    <div class="bilgi">Sadece yönetici girişi yapabilir.</div>
  </div>

  <!-- PANEL -->
  <div id="panel" class="gizli">
    <h1>⚙️ PC Bilgileri Yönetimi</h1>

    <!-- TOKEN -->
    <div id="tokenAlani">
      <label style="font-size:12px;color:#94a3b8;display:block;margin-bottom:6px;">
        GitHub Token (sadece ilk seferde gerekli)
      </label>
      <input type="password" id="token" placeholder="ghp_..." />
      <button onclick="tokenKaydet()">Token'ı Kaydet</button>
      <div class="bilgi">
        Token sadece bu telefonda saklanır. Bir kere girmen yeterli.
      </div>
    </div>

    <button class="ikincil" onclick="tokenSifirla()" style="margin-top:10px;">
      Token'ı Sıfırla
    </button>

    <hr style="border:1px solid #334155;margin:20px 0;">

    <!-- PC LİSTESİ -->
    <div id="pcListesi"></div>

    <div class="durum" id="durum"></div>

    <button onclick="kaydet()" style="margin-top:16px;">💾 Tümünü Kaydet</button>
    <button class="ikincil" onclick="veriYukle()" style="margin-top:8px;">🔄 Yenile</button>
  </div>

</div>

<script>
  const ADMIN_SIFRE = "1234";
  const REPO = "takiphacamat-coder/Pcsifretakip";
  const DOSYA = "data.json";
  const TOKEN_KEY = "gh_token_pcsifre";

  let veri = null;

  // === GİRİŞ ===
  function girisYap() {
    const s = document.getElementById("sifreGiris").value;
    if (s === ADMIN_SIFRE) {
      document.getElementById("giris").classList.add("gizli");
      document.getElementById("panel").classList.remove("gizli");
      tokenKontrol();
      veriYukle();
    } else {
      alert("Yanlış şifre!");
    }
  }

  // === TOKEN ===
  function tokenKontrol() {
    const t = localStorage.getItem(TOKEN_KEY);
    if (t) document.getElementById("tokenAlani").classList.add("gizli");
  }
  function tokenKaydet() {
    const t = document.getElementById("token").value.trim();
    if (!t) { alert("Token boş!"); return; }
    localStorage.setItem(TOKEN_KEY, t);
    document.getElementById("tokenAlani").classList.add("gizli");
    alert("Token kaydedildi.");
  }
  function tokenSifirla() {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById("tokenAlani").classList.remove("gizli");
    alert("Token silindi. Yeniden girmen gerekiyor.");
  }

  // === VERİ YÜKLE ===
  function veriYukle() {
    fetch("data.json?v=" + Date.now())
      .then(r => r.json())
      .then(d => {
        veri = d;
        pcListesiCiz();
      })
      .catch(() => alert("Veri yüklenemedi."));
  }

  function pcListesiCiz() {
    const alan = document.getElementById("pcListesi");
    alan.innerHTML = "";
    veri.pcs.forEach((pc, i) => {
      alan.innerHTML += `
        <div class="pc-kart">
          <h3>💻 PC ${pc.id}</h3>
          <label>Bilgisayar Adı</label>
          <input data-i="${i}" data-f="pcAdi" value="${pc.pcAdi || ""}" />
          <label>Kullanıcı Adı</label>
          <input data-i="${i}" data-f="kullaniciAdi" value="${pc.kullaniciAdi || ""}" />
          <label>Şifre</label>
          <input data-i="${i}" data-f="sifre" value="${pc.sifre || ""}" />
          <label>Bit Broker</label>
          <input data-i="${i}" data-f="bitBroker" value="${pc.bitBroker || ""}" />
        </div>
      `;
    });
  }

  // === KAYDET ===
  function kaydet() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { alert("Önce GitHub token gir!"); return; }

    // Formdaki değerleri veriye yaz
    document.querySelectorAll("#pcListesi input").forEach(inp => {
      const i = parseInt(inp.dataset.i);
      const f = inp.dataset.f;
      veri.pcs[i][f] = inp.value;
    });

    // GitHub API'ye PUT
    const url = `https://api.github.com/repos/${REPO}/contents/${DOSYA}`;

    // Önce mevcut sha'yı al (güncelleme için gerekli)
    fetch(url, { headers: { "Authorization": "token " + token } })
      .then(r => r.json())
      .then(mevcut => {
        const sha = mevcut.sha;
        const icerik = btoa(unescape(encodeURIComponent(JSON.stringify(veri, null, 2))));

        return fetch(url, {
          method: "PUT",
          headers: {
            "Authorization": "token " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "PC bilgileri güncellendi",
            content: icerik,
            sha: sha
          })
        });
      })
      .then(r => r.json())
      .then(sonuc => {
        if (sonuc.content) {
          durumGoster("✅ Kaydedildi! 1-2 dakika içinde herkes görür.", "ok");
        } else {
          durumGoster("❌ Hata: " + (sonuc.message || "Bilinmeyen hata"), "hata");
        }
      })
      .catch(e => durumGoster("❌ Bağlantı hatası: " + e.message, "hata"));
  }

  function durumGoster(mesaj, tip) {
    const d = document.getElementById("durum");
    d.textContent = mesaj;
    d.className = "durum " + tip;
    setTimeout(() => { d.className = "durum"; }, 5000);
  }
</script>

</body>
</html>
