<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A1A3C">
<title>PC Bilgileri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A1A3C;
  --bg-deep: #071229;
  --surface: #0F2350;
  --surface-2: #142B5E;
  --line: #24417F;
  --line-soft: #1B3468;
  --text: #F4F6FC;
  --muted: #9FB0DA;
  --faint: #718AC0;
  --accent: #F5B400;
  --accent-soft: #FFD84D;
  --ok: #3DDC97;
  --warn: #FFB84D;
  --err: #FF7A88;
  --ui: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { color-scheme: dark; }

body {
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--ui);
  color: var(--text);
  background:
    radial-gradient(60rem 40rem at 8% -12%, rgba(245, 180, 0, .22), transparent 60%),
    radial-gradient(50rem 36rem at 112% 112%, rgba(60, 110, 220, .28), transparent 55%),
    radial-gradient(46rem 34rem at 50% 50%, rgba(30, 58, 127, .35), transparent 65%),
    var(--bg);
  background-attachment: fixed;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}

/* İnce nokta ızgarası: ekranın ortasında görünür, kenarlarda söner */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, .06) 1px, transparent 1px);
  background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%);
          mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%);
  pointer-events: none;
}

#kok { position: relative; width: 100%; max-width: 440px; }

:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 3px; }
button { font-family: inherit; }

/* ============ ORTAK BİLEŞENLER ============ */
.panel {
  background: linear-gradient(180deg, rgba(27, 36, 69, .92), rgba(20, 27, 52, .94));
  border: 1px solid var(--line);
  border-radius: 28px;
  padding: 24px;
  box-shadow:
    0 36px 70px -28px rgba(3, 6, 24, .85),
    inset 0 1px 0 rgba(255, 255, 255, .05);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  padding: 0 22px;
  border-radius: 16px;
  border: 1px solid transparent;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .01em;
  cursor: pointer;
  transition: transform .15s ease, filter .2s ease, background .2s ease, border-color .2s ease, color .2s ease;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:active { transform: scale(.97); }
.btn-block { width: 100%; }

.btn-primary {
  color: var(--bg-deep);
  background: linear-gradient(135deg, var(--accent), var(--accent-soft));
  box-shadow: 0 12px 26px -12px rgba(245, 180, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .22);
}
.btn-primary:hover { filter: brightness(1.1); }

.btn-ghost {
  color: var(--text);
  background: rgba(255, 255, 255, .04);
  border-color: var(--line);
}
.btn-ghost:hover { background: rgba(255, 255, 255, .08); border-color: #3A4780; }

.btn-text {
  min-height: 44px;
  padding: 0 14px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  background: none;
}
.btn-text:hover { color: var(--text); }

.gizli { display: none !important; }

.spinner {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 3px solid var(--line);
  border-top-color: var(--accent);
  animation: don .8s linear infinite;
}
@keyframes don { to { transform: rotate(360deg); } }

/* ============ KULLANICI EKRANI ============ */
.ticket { padding: 22px 20px 20px; }
@media (prefers-reduced-motion: no-preference) {
  .ticket { animation: yuksel .5s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes yuksel { from { opacity: 0; transform: translateY(14px); } }
}

.ticket-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 26px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-icon {
  width: 42px; height: 42px;
  border-radius: 13px;
  display: grid; place-items: center;
  color: var(--bg-deep);
  background: linear-gradient(135deg, var(--accent), var(--accent-soft));
  box-shadow: 0 10px 22px -10px rgba(245, 180, 0, .5);
  flex: none;
}
.brand-icon svg { width: 22px; height: 22px; }
.brand-text { font-size: 15px; font-weight: 600; color: var(--muted); }

.pc-badge {
  flex: none;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 16px;
  font-weight: 800;
  color: var(--bg-deep);
  background: var(--accent);
  border: 1px solid var(--accent);
  font-variant-numeric: tabular-nums;
}

.pc-name {
  font-size: clamp(36px, 11vw, 48px);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -.025em;
  word-break: break-word;
}
.pc-sub { margin-top: 8px; font-size: 17px; color: var(--muted); }

.fields {
  margin-top: 24px;
  padding-top: 22px;
  border-top: 1px dashed var(--line);
  display: grid;
  gap: 10px;
}
.field {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 18px;
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .03));
  border: 1px solid rgba(255, 255, 255, .14);
  border-left: 3px solid rgba(255, 199, 44, .75);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .2),
    inset 0 -10px 18px -12px rgba(0, 0, 0, .35),
    0 14px 22px -14px rgba(2, 4, 20, .75);
}
.field-text { flex: 1; min-width: 0; }
.field-label { display: block; font-size: 15px; font-weight: 600; color: var(--muted); }
.field-value {
  display: block;
  margin-top: 5px;
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--text);
  word-break: break-all;
}
.field-value.bos { color: var(--faint); font-family: var(--ui); font-weight: 500; font-size: 17px; }



.durum-kutu { text-align: center; padding: 30px 12px 26px; }
.durum-kutu .spinner { margin: 6px auto 16px; }
.durum-kutu h2 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.durum-kutu p { margin-top: 8px; font-size: 15px; line-height: 1.5; color: var(--muted); }
.durum-kutu .hata-ikon {
  width: 54px; height: 54px; margin: 0 auto 16px;
  border-radius: 18px;
  display: grid; place-items: center;
  color: var(--err);
  background: rgba(255, 122, 136, .12);
  border: 1px solid rgba(255, 122, 136, .3);
}
.durum-kutu .hata-ikon svg { width: 26px; height: 26px; }

/* ============ CAM + 3D (PC bilgi ekranı) ============ */
.sahne {
  display: none;
  position: fixed;
  inset: -24px;
  overflow: hidden;
  pointer-events: none;
  transform: translate3d(calc(var(--nx, 0) * -18px), calc(var(--ny, 0) * -18px), 0);
  transition: transform .2s ease-out;
}
body.kullanici .sahne { display: block; }

.kure { position: absolute; border-radius: 50%; }
.k1 {
  width: 220px; height: 220px; left: -10px; top: 8%;
  background: radial-gradient(circle at 32% 28%, #D8E4FF 0%, #3C6EDC 30%, #12275C 66%, #071229 100%);
  box-shadow: 0 46px 60px -24px rgba(18, 39, 92, .9), inset -18px -22px 40px rgba(4, 10, 30, .55);
}
.k2 {
  width: 190px; height: 190px; right: -20px; bottom: 7%;
  background: radial-gradient(circle at 30% 28%, #FFF1C2 0%, #FFC72C 34%, #A87600 70%, #4A3200 100%);
  box-shadow: 0 46px 60px -24px rgba(140, 100, 0, .8), inset -16px -20px 36px rgba(30, 20, 0, .4);
}
.k3 {
  width: 96px; height: 96px; right: 16%; top: 4%;
  background: radial-gradient(circle at 30% 28%, #DDE8FF 0%, #6E93F5 36%, #24417F 72%, #0F2350 100%);
  box-shadow: 0 26px 36px -16px rgba(20, 40, 100, .8), inset -10px -12px 22px rgba(6, 10, 30, .5);
}
@media (prefers-reduced-motion: no-preference) {
  .k1 { animation: yuz 9s ease-in-out infinite; }
  .k2 { animation: yuz 11s ease-in-out -3s infinite; }
  .k3 { animation: yuz 7s ease-in-out -5s infinite; }
  @keyframes yuz { 50% { translate: 0 -16px; } }
}

.kart3d {
  will-change: transform;
}

.panel.cam {
  position: relative;
  background:
    linear-gradient(135deg, rgba(255, 220, 120, .16), rgba(255, 255, 255, .04) 45%, rgba(90, 140, 255, .10)),
    rgba(10, 22, 55, .42);
  -webkit-backdrop-filter: blur(24px) saturate(170%);
          backdrop-filter: blur(24px) saturate(170%);
  border: 1px solid rgba(255, 255, 255, .18);
  border-top: 2px solid rgba(255, 199, 44, .55);
  border-radius: 28px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .3),
    inset 0 -1px 0 rgba(255, 255, 255, .06),
    0 3px 0 rgba(255, 199, 44, .16),
    0 7px 0 rgba(20, 40, 100, .18),
    calc(var(--nx, 0) * -14px) calc(34px + var(--ny, 0) * -12px) 60px -18px rgba(2, 4, 22, .85);
}
/* Işık yansıması: parmağı / telefonu hareket ettirdikçe kayar */
.panel.cam::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(420px circle at calc(50% + var(--nx, 0) * 45%) calc(28% + var(--ny, 0) * 35%), rgba(255, 230, 160, .22), transparent 60%);
}
.panel.cam > * { position: relative; z-index: 1; }

.ticket .brand-icon {
  box-shadow: 0 10px 22px -10px rgba(245, 180, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -3px 6px rgba(0, 0, 30, .3);
}
.ticket .brand-text, .ticket .pc-sub, .ticket .field-label { color: #C7D2F0; }
.ticket .pc-name, .ticket .field-value { text-shadow: 0 2px 12px rgba(2, 4, 24, .5); }
.ticket .pc-name { color: #FFE8A3; }
.ticket .field-value { font-size: 26px; }
.ticket .fields { border-top-color: rgba(255, 255, 255, .2); }
.ticket .field-value.bos { color: #9AA6CC; text-shadow: none; }

/* ============ ADMIN ============ */
.admin-kap { display: block; }

.login { text-align: center; padding: 32px 24px 26px; }
.login-ikon {
  width: 62px; height: 62px;
  margin: 0 auto 18px;
  border-radius: 20px;
  display: grid; place-items: center;
  color: var(--accent-soft);
  background: rgba(245, 180, 0, .14);
  border: 1px solid rgba(245, 180, 0, .35);
}
.login-ikon svg { width: 28px; height: 28px; }
.login h1 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.login .alt { margin: 8px 0 22px; font-size: 15px; color: var(--muted); }
.login .input { text-align: center; font-size: 18px; letter-spacing: .12em; }
.login .btn { margin-top: 14px; }

.input {
  width: 100%;
  min-height: 52px;
  padding: 0 16px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(8, 12, 28, .6);
  color: var(--text);
  font-family: var(--ui);
  font-size: 16px;
  font-weight: 600;
  transition: border-color .2s, box-shadow .2s;
}
.input.mono { font-family: var(--mono); font-weight: 500; }
.input::placeholder { color: var(--faint); font-weight: 500; letter-spacing: 0; }
.input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(245, 180, 0, .25);
}
.input.sallan { animation: sallan .35s; border-color: var(--err); }
@keyframes sallan {
  20% { transform: translateX(-7px); } 40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); } 80% { transform: translateX(3px); }
}
.alan-hata { min-height: 20px; margin-top: 10px; font-size: 14px; font-weight: 600; color: var(--err); }

.ana-baslik { padding: 4px 4px 18px; }
.ana-baslik h1 { font-size: 30px; font-weight: 800; letter-spacing: -.025em; }
.ana-baslik p { margin-top: 6px; font-size: 15px; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; perspective: 700px; }
.kutu {
  position: relative;
  aspect-ratio: 1 / 1.05;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 8px;
  border-radius: 22px;
  cursor: pointer;
  color: var(--text);
  background:
    linear-gradient(135deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .02) 45%, rgba(245, 180, 0, .08)),
    rgba(16, 26, 58, .55);
  -webkit-backdrop-filter: blur(16px) saturate(170%);
          backdrop-filter: blur(16px) saturate(170%);
  border: 1px solid rgba(255, 255, 255, .16);
  border-top: 2px solid rgba(255, 199, 44, .55);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .18),
    0 18px 32px -22px rgba(3, 6, 24, .9);
  transform-style: preserve-3d;
  will-change: transform;
  transition: transform .12s ease-out, border-color .2s ease, box-shadow .2s ease;
}
.kutu:hover { border-color: rgba(245, 180, 0, .7); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 18px 32px -20px rgba(245, 180, 0, .4); }
.kutu:active { transform: scale(.96) !important; }
.kutu-icon { width: 30px; height: 30px; color: var(--accent); flex: none; }
.kutu-icon svg { width: 100%; height: 100%; }
.kutu-num { font-size: 22px; font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--accent-soft); }
.kutu-pc {
  max-width: 100%;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.kutu-nokta {
  position: absolute; top: 12px; right: 12px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--warn);
  box-shadow: 0 0 0 3px rgba(255, 184, 77, .16);
}
.kutu-nokta.tam { background: var(--ok); box-shadow: 0 0 0 3px rgba(61, 220, 151, .16); }

.aciklama { display: flex; justify-content: center; gap: 18px; margin-top: 16px; font-size: 13px; color: var(--muted); }
.aciklama span { display: inline-flex; align-items: center; gap: 7px; }
.aciklama i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.aciklama i.tam { background: var(--ok); }

.alt-cubuk { display: flex; justify-content: center; margin-top: 8px; }

/* Form */
.form-panel { padding: 22px 20px 20px; }
.form-ust { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.form-ust .brand-icon { width: 46px; height: 46px; border-radius: 14px; }
.form-ust h1 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.form-ust p { margin-top: 2px; font-size: 14px; color: var(--muted); }

.form-alan { margin-top: 14px; }
.form-alan label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }

.token-kap {
  padding: 14px;
  margin-bottom: 4px;
  border-radius: 16px;
  background: rgba(245, 180, 0, .08);
  border: 1px dashed rgba(245, 180, 0, .4);
}
.token-kap .token-baslik { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 14px; font-weight: 700; color: var(--accent-soft); }
.token-kap .token-baslik svg { width: 18px; height: 18px; }
.token-kap .token-not { margin-bottom: 12px; font-size: 13px; line-height: 1.5; color: var(--muted); }
.token-kap .input { margin-bottom: 10px; }

.durum {
  display: none;
  margin-top: 16px;
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  line-height: 1.4;
}
.durum.bekle { display: block; color: var(--accent-soft); background: rgba(245, 180, 0, .12); border: 1px solid rgba(245, 180, 0, .3); }
.durum.ok { display: block; color: var(--ok); background: rgba(61, 220, 151, .1); border: 1px solid rgba(61, 220, 151, .3); }
.durum.hata { display: block; color: var(--err); background: rgba(255, 122, 136, .1); border: 1px solid rgba(255, 122, 136, .3); }

.btn-satir { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; margin-top: 20px; }

/* Bildirim */
.toast {
  position: fixed;
  left: 50%;
  bottom: max(24px, env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  max-width: calc(100vw - 32px);
  padding: 13px 18px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--line);
  box-shadow: 0 20px 40px -16px rgba(3, 6, 24, .9);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 10;
}
.toast.goster { opacity: 1; transform: translate(-50%, 0); }
.toast.hata { border-color: rgba(255, 122, 136, .5); color: var(--err); }
.toast.ok { border-color: rgba(61, 220, 151, .5); }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="sahne" aria-hidden="true"><i class="kure k1"></i><i class="kure k2"></i><i class="kure k3"></i></div>
<div id="kok"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const ADMIN_SIFRE = "1234";
const REPO = "takiphacamat-coder/Pcsifretakip";
const DOSYA = "data.json";
const TOKEN_KEY = "gh_token_pcsifre";
const params = new URLSearchParams(window.location.search);
const kok = document.getElementById("kok");

/* ---------- Yardımcılar ---------- */
const IKON = {
  monitor: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  laptop:  '<rect x="4" y="4" width="16" height="10" rx="1.5"/><path d="M2 19h20l-1.6-3H3.6z"/>',
  lock:    '<rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  copy:    '<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H16"/>',
  check:   '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  key:     '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  save:    '<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',
  back:    '<path d="M15 5l-7 7 7 7"/>',
  alert:   '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>'
};
function ikon(ad) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IKON[ad] + '</svg>';
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
let toastZamani;
function bildirim(mesaj, tip) {
  const t = document.getElementById("toast");
  t.textContent = mesaj;
  t.className = "toast goster " + (tip || "");
  clearTimeout(toastZamani);
  toastZamani = setTimeout(() => { t.className = "toast"; }, 2600);
}

if (params.has("admin")) { adminEkrani(); } else { kullaniciEkrani(); }

/* ================= KULLANICI ================= */
function kullaniciEkrani() {
  const pcId = parseInt(params.get("pc"));
  document.body.classList.add("kullanici");
  kok.innerHTML = '<div class="kart3d"><div class="panel cam ticket"><div class="durum-kutu"><div class="spinner"></div><p>Yükleniyor</p></div></div></div>';
  const kart = kok.querySelector(".ticket");

  function hataGoster(baslik, aciklama) {
    kart.innerHTML =
      '<div class="durum-kutu">' +
        '<div class="hata-ikon">' + ikon("alert") + '</div>' +
        '<h2>' + baslik + '</h2>' +
        '<p>' + aciklama + '</p>' +
      '</div>';
  }

  if (!pcId || pcId < 1 || pcId > 9) {
    hataGoster("Geçersiz PC numarası", "QR kodu tekrar okutun.");
    return;
  }

  fetch("data.json?v=" + Date.now()).then(r => r.json()).then(data => {
    const pc = data.pcs.find(p => p.id === pcId);
    if (!pc) { hataGoster("PC bulunamadı", "Bu numaraya ait kayıt yok."); return; }

    const ad = pc.pcAdi || "PC " + pc.id;
    const alanlar = [
      ["Kullanıcı adı", pc.kullaniciAdi],
      ["Şifre", pc.sifre],
      ["Bit Broker", pc.bitBroker]
    ];

    kart.innerHTML =
      '<div class="ticket-head">' +
        '<div class="brand"><div class="brand-icon">' + ikon("monitor") + '</div><span class="brand-text">Erişim bilgileri</span></div>' +
        '<div class="pc-badge">PC ' + esc(pc.id) + '</div>' +
      '</div>' +
      '<h1 class="pc-name">' + esc(ad) + '</h1>' +
      '<p class="pc-sub">Bu bilgisayara giriş bilgileri</p>' +
      '<div class="fields">' +
        alanlar.map(a =>
          '<div class="field">' +
            '<div class="field-text">' +
              '<span class="field-label">' + a[0] + '</span>' +
              '<span class="field-value' + (a[1] ? '' : ' bos') + '">' + (a[1] ? esc(a[1]) : 'Girilmemiş') + '</span>' +
            '</div>' +
          '</div>'
        ).join("") +
      '</div>';

    egimKur();
  }).catch(() => {
    hataGoster("Veri yüklenemedi", "İnternet bağlantısını kontrol edin.");
  });
}

let egimHazir = false;
function egimKur() {
  if (egimHazir) return;
  egimHazir = true;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const kok2 = document.documentElement;
  const sinir = v => Math.max(-1, Math.min(1, v));
  let gyro = false;
  const ayarla = (x, y) => {
    kok2.style.setProperty("--nx", sinir(x).toFixed(3));
    kok2.style.setProperty("--ny", sinir(y).toFixed(3));
  };
  window.addEventListener("deviceorientation", e => {
    if (e.gamma == null || e.beta == null) return;
    gyro = true;
    ayarla(e.gamma / 25, (e.beta - 55) / 25);
  }, { passive: true });
  window.addEventListener("pointermove", e => {
    if (gyro) return;
    ayarla((e.clientX / window.innerWidth - .5) * 2, (e.clientY / window.innerHeight - .5) * 2);
  }, { passive: true });
}

/* ================= ADMIN ================= */
let veri = null;
let aktifPc = null;

function adminEkrani() {
  kok.innerHTML =
    '<div class="admin-kap">' +
      '<section class="panel login" id="girisKutu">' +
        '<div class="login-ikon">' + ikon("lock") + '</div>' +
        '<h1>Yönetici girişi</h1>' +
        '<p class="alt">Devam etmek için şifreni gir.</p>' +
        '<input class="input" type="password" id="sifreGiris" placeholder="Şifre" inputmode="numeric" autocomplete="off" />' +
        '<div class="alan-hata" id="girisHata" role="alert"></div>' +
        '<button class="btn btn-primary btn-block" type="button" onclick="girisYap()">Giriş yap</button>' +
      '</section>' +
      '<section id="anaPanel" class="gizli">' +
        '<div class="ana-baslik"><h1>PC seç</h1><p>Düzenlemek istediğin bilgisayara dokun.</p></div>' +
        '<div class="grid" id="grid"></div>' +
        '<div class="aciklama"><span><i class="tam"></i>Bilgiler tam</span><span><i></i>Eksik var</span></div>' +
        '<div class="alt-cubuk"><button class="btn btn-text" type="button" onclick="tokenSifirla()">' + ikon("key") + 'Token\'ı sıfırla</button></div>' +
      '</section>' +
      '<section id="formPanel" class="gizli"></section>' +
    '</div>';

  document.getElementById("sifreGiris").addEventListener("keydown", e => {
    if (e.key === "Enter") girisYap();
  });
}

function girisYap() {
  const girdi = document.getElementById("sifreGiris");
  const hata = document.getElementById("girisHata");
  if (girdi.value === ADMIN_SIFRE) {
    document.getElementById("girisKutu").classList.add("gizli");
    document.getElementById("anaPanel").classList.remove("gizli");
    veriYukle();
  } else {
    hata.textContent = "Şifre yanlış. Tekrar dene.";
    girdi.classList.remove("sallan");
    void girdi.offsetWidth;
    girdi.classList.add("sallan");
    girdi.select();
  }
}

function veriYukle() {
  fetch("data.json?v=" + Date.now()).then(r => r.json()).then(d => {
    veri = d;
    gridCiz();
  }).catch(() => bildirim("Veri yüklenemedi. Bağlantını kontrol et.", "hata"));
}

function gridCiz() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  veri.pcs.forEach(pc => {
    const tam = !!(pc.kullaniciAdi && pc.sifre && pc.bitBroker);
    const k = document.createElement("button");
    k.type = "button";
    k.className = "kutu";
    k.setAttribute("aria-label", (pc.pcAdi || "PC " + pc.id) + " düzenle");
    k.innerHTML =
      '<span class="kutu-nokta' + (tam ? ' tam' : '') + '"></span>' +
      '<span class="kutu-icon">' + ikon("laptop") + '</span>' +
      '<span class="kutu-num">' + esc(pc.id) + '</span>' +
      '<span class="kutu-pc">' + esc(pc.pcAdi || "PC " + pc.id) + '</span>';
    k.onclick = () => formAc(pc.id);
    kutuTiltKur(k);
    grid.appendChild(k);
  });
}

function kutuTiltKur(el) {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  el.addEventListener("pointermove", e => {
    if (e.pointerType === "touch") return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform = "perspective(600px) rotateX(" + (-py * 16).toFixed(2) + "deg) rotateY(" + (px * 16).toFixed(2) + "deg) scale(1.04)";
  }, { passive: true });
  el.addEventListener("pointerleave", () => { el.style.transform = ""; });
  el.addEventListener("touchstart", () => {
    el.style.transform = "perspective(600px) rotateX(-6deg) scale(1.05)";
  }, { passive: true });
  el.addEventListener("touchend", () => { el.style.transform = ""; }, { passive: true });
}

function formAc(id) {
  aktifPc = veri.pcs.find(p => p.id === id);
  document.getElementById("anaPanel").classList.add("gizli");
  const fp = document.getElementById("formPanel");
  fp.classList.remove("gizli");
  fp.innerHTML =
    '<div class="panel form-panel">' +
      '<div class="form-ust">' +
        '<div class="brand-icon">' + ikon("monitor") + '</div>' +
        '<div><h1>PC ' + esc(aktifPc.id) + '</h1><p>Bilgileri düzenle</p></div>' +
      '</div>' +
      '<div class="token-kap" id="tokenKap"></div>' +
      '<div class="form-alan"><label for="f_pcAdi">Bilgisayar adı</label>' +
        '<input class="input" id="f_pcAdi" value="' + esc(aktifPc.pcAdi) + '" autocomplete="off" /></div>' +
      '<div class="form-alan"><label for="f_kullaniciAdi">Kullanıcı adı</label>' +
        '<input class="input mono" id="f_kullaniciAdi" value="' + esc(aktifPc.kullaniciAdi) + '" autocomplete="off" autocapitalize="off" /></div>' +
      '<div class="form-alan"><label for="f_sifre">Şifre</label>' +
        '<input class="input mono" id="f_sifre" value="' + esc(aktifPc.sifre) + '" autocomplete="off" autocapitalize="off" /></div>' +
      '<div class="form-alan"><label for="f_bitBroker">Bit Broker</label>' +
        '<input class="input mono" id="f_bitBroker" value="' + esc(aktifPc.bitBroker) + '" autocomplete="off" autocapitalize="off" /></div>' +
      '<div class="durum" id="durum"></div>' +
      '<div class="btn-satir">' +
        '<button class="btn btn-ghost" type="button" onclick="geriDon()">' + ikon("back") + 'Geri</button>' +
        '<button class="btn btn-primary" type="button" onclick="kaydet()">' + ikon("save") + 'Kaydet</button>' +
      '</div>' +
    '</div>';
  tokenKontrol();
}

function geriDon() {
  document.getElementById("formPanel").classList.add("gizli");
  document.getElementById("formPanel").innerHTML = "";
  document.getElementById("anaPanel").classList.remove("gizli");
  gridCiz();
}

function tokenKontrol() {
  const kap = document.getElementById("tokenKap");
  if (!kap) return;
  if (localStorage.getItem(TOKEN_KEY)) { kap.classList.add("gizli"); return; }
  kap.classList.remove("gizli");
  kap.innerHTML =
    '<div class="token-baslik">' + ikon("key") + 'GitHub token gerekli</div>' +
    '<p class="token-not">İlk kayıttan önce bir kez girmen yeterli. Bu cihazda saklanır.</p>' +
    '<input class="input mono" type="password" id="token" placeholder="github_pat_..." autocomplete="off" />' +
    '<button class="btn btn-ghost btn-block" type="button" onclick="tokenKaydet()">Token\'ı kaydet</button>';
}
function tokenKaydet() {
  const t = document.getElementById("token").value.trim();
  if (!t) { bildirim("Token boş olamaz.", "hata"); return; }
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById("tokenKap").classList.add("gizli");
  bildirim("Token kaydedildi.", "ok");
}
function tokenSifirla() {
  localStorage.removeItem(TOKEN_KEY);
  bildirim("Token silindi. Sonraki kayıtta yeniden girmen gerekir.");
}

function kaydet() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) { bildirim("Önce GitHub token'ını gir.", "hata"); return; }

  aktifPc.pcAdi = document.getElementById("f_pcAdi").value;
  aktifPc.kullaniciAdi = document.getElementById("f_kullaniciAdi").value;
  aktifPc.sifre = document.getElementById("f_sifre").value;
  aktifPc.bitBroker = document.getElementById("f_bitBroker").value;

  const url = "https://api.github.com/repos/" + REPO + "/contents/" + DOSYA;
  durumGoster("Kaydediliyor...", "bekle");

  fetch(url, { headers: { "Authorization": "token " + token } })
    .then(r => r.json()).then(mevcut => {
      const sha = mevcut.sha;
      const icerik = btoa(unescape(encodeURIComponent(JSON.stringify(veri, null, 2))));
      return fetch(url, {
        method: "PUT",
        headers: { "Authorization": "token " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "PC " + aktifPc.id + " güncellendi", content: icerik, sha: sha })
      });
    })
    .then(r => r.json())
    .then(sonuc => {
      if (sonuc.content) {
        durumGoster("Kaydedildi. 1-2 dk içinde herkes görür.", "ok");
        setTimeout(geriDon, 1500);
      } else {
        durumGoster("Kaydedilemedi: " + (sonuc.message || "Bilinmeyen hata"), "hata");
      }
    })
    .catch(e => durumGoster("Bağlantı hatası: " + e.message, "hata"));
}

function durumGoster(mesaj, tip) {
  const d = document.getElementById("durum");
  if (!d) return;
  d.textContent = mesaj;
  d.className = "durum " + tip;
  if (tip === "hata") setTimeout(() => { d.className = "durum"; }, 5000);
}
</script>
