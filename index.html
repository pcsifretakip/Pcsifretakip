<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PC Bilgileri</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #faf6ee;
  color: #3a3226;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
}

/* ============ KULLANICI EKRANI ============ */
.kart {
  background: #ffffff;
  border-radius: 18px;
  padding: 20px;
  max-width: 500px;
  width: 100%;
  max-height: 100vh;
  overflow-y: auto;
  box-shadow: 0 12px 40px rgba(120, 100, 60, 0.15);
  border: 1px solid #e8dfc8;
}
.baslik {
  font-size: 28px;
  font-weight: 800;
  color: #c47a1e;
  margin-bottom: 18px;
  text-align: center;
  padding-bottom: 14px;
  border-bottom: 2px solid #f0e6cc;
}
.satir {
  background: #fdfaf2;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  border-left: 5px solid #e8a63c;
}
.etiket {
  font-size: 13px;
  color: #a89a78;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 6px;
  font-weight: 700;
}
.deger {
  font-size: 26px;
  color: #2d2519;
  word-break: break-all;
  font-weight: 700;
  line-height: 1.2;
}
.hata { text-align: center; color: #c0392b; padding: 30px 20px; font-size: 18px; }
.yukleniyor { text-align: center; padding: 40px; color: #a89a78; font-size: 16px; }

/* ============ ADMIN EKRANI ============ */
.admin-kap {
  width: 100%;
  max-width: 500px;
  height: 100%;
  max-height: 100vh;
  display: flex;
  flex-direction: column;
}
.admin-baslik {
  font-size: 22px;
  font-weight: 800;
  color: #c47a1e;
  text-align: center;
  padding: 10px 0 16px;
}
.giris-kutu {
  background: #ffffff;
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 12px 40px rgba(120, 100, 60, 0.15);
  border: 1px solid #e8dfc8;
}
.giris-kutu h1 { color: #c47a1e; font-size: 22px; margin-bottom: 18px; text-align: center; }
.giris-kutu input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 2px solid #e8dfc8;
  background: #fdfaf2;
  color: #2d2519;
  font-size: 16px;
  margin-bottom: 12px;
  font-family: inherit;
  text-align: center;
}
.giris-kutu input:focus { outline: none; border-color: #e8a63c; }
.giris-kutu button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: #e8a63c;
  color: #ffffff;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 4px 0 #b8821f;
  transition: all 0.1s;
}
.giris-kutu button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8821f; }

/* 9 KUTU GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 10px;
  flex: 1;
  min-height: 0;
  padding: 4px;
}
.kutu {
  background: #ffffff;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 2px solid #e8dfc8;
  box-shadow: 0 4px 0 #dccfb0;
  transition: all 0.1s;
  user-select: none;
  padding: 4px;
}
.kutu:active { transform: translateY(3px); box-shadow: 0 1px 0 #dccfb0; }
.kutu .kutu-num {
  font-size: 28px;
  font-weight: 800;
  color: #c47a1e;
}
.kutu .kutu-pc {
  font-size: 11px;
  color: #a89a78;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 2px;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}

/* FORM EKRANI */
.form-kap {
  background: #ffffff;
  border-radius: 18px;
  padding: 20px;
  width: 100%;
  max-height: 100vh;
  overflow-y: auto;
  box-shadow: 0 12px 40px rgba(120, 100, 60, 0.15);
  border: 1px solid #e8dfc8;
}
.form-baslik {
  font-size: 20px;
  font-weight: 800;
  color: #c47a1e;
  text-align: center;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px solid #f0e6cc;
}
.form-kap label {
  font-size: 12px;
  color: #a89a78;
  text-transform: uppercase;
  letter-spacing: 1px;
  display: block;
  margin-bottom: 5px;
  margin-top: 10px;
  font-weight: 700;
}
.form-kap input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 2px solid #e8dfc8;
  background: #fdfaf2;
  color: #2d2519;
  font-size: 16px;
  font-family: inherit;
}
.form-kap input:focus { outline: none; border-color: #e8a63c; }
.btn-satir { display: flex; gap: 10px; margin-top: 18px; }
.btn {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  font-family: inherit;
}
.btn-kaydet { background: #2e8b57; color: #ffffff; box-shadow: 0 4px 0 #1f5f3a; }
.btn-kaydet:active { transform: translateY(3px); box-shadow: 0 1px 0 #1f5f3a; }
.btn-geri { background: #e8a63c; color: #ffffff; box-shadow: 0 4px 0 #b8821f; }
.btn-geri:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8821f; }
.btn-ikincil { background: #a89a78; color: #ffffff; box-shadow: 0 4px 0 #7d7256; font-size: 12px; padding: 10px; }
.btn-ikincil:active { transform: translateY(3px); box-shadow: 0 1px 0 #7d7256; }

.durum {
  text-align: center;
  padding: 10px;
  border-radius: 8px;
  margin-top: 12px;
  font-size: 13px;
  display: none;
  font-weight: 700;
}
.durum.ok { background: #d4edda; color: #155724; display: block; }
.durum.hata { background: #f8d7da; color: #721c24; display: block; }
.gizli { display: none !important; }
.bilgi { font-size: 12px; color: #a89a78; margin-top: 8px; line-height: 1.5; text-align: center; }

/* token alanı */
.token-kap {
  background: #fdfaf2;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 12px;
  border: 1px dashed #dccfb0;
}
.token-kap input { margin-bottom: 8px; }
</style>
</head>
<body>

<div id="kok" style="width:100%; display:flex; justify-content:center;"></div>

<script>
const ADMIN_SIFRE = "1234";
const REPO = "takiphacamat-coder/Pcsifretakip";
const DOSYA = "data.json";
const TOKEN_KEY = "gh_token_pcsifre";
const params = new URLSearchParams(window.location.search);
const kok = document.getElementById("kok");

if (params.has("admin")) { adminEkrani(); } else { kullaniciEkrani(); }

/* ================= KULLANICI ================= */
function kullaniciEkrani() {
  const pcId = parseInt(params.get("pc"));
  kok.innerHTML = '<div class="kart"><div class="yukleniyor">Yükleniyor...</div></div>';
  const kart = kok.querySelector(".kart");
  if (!pcId || pcId < 1 || pcId > 9) {
    kart.innerHTML = '<div class="hata">❌ Geçersiz PC numarası.<br>QR kodu tekrar okutun.</div>';
    return;
  }
  fetch("data.json?v=" + Date.now()).then(r => r.json()).then(data => {
    const pc = data.pcs.find(p => p.id === pcId);
    if (!pc) { kart.innerHTML = '<div class="hata">❌ PC bulunamadı.</div>'; return; }
    kart.innerHTML = '<div class="baslik">💻 ' + (pc.pcAdi || "PC " + pc.id) + '</div>' +
      '<div class="satir"><div class="etiket">Bilgisayar Adı</div><div class="deger">' + (pc.pcAdi || "-") + '</div></div>' +
      '<div class="satir"><div class="etiket">Kullanıcı Adı</div><div class="deger">' + (pc.kullaniciAdi || "-") + '</div></div>' +
      '<div class="satir"><div class="etiket">Şifre</div><div class="deger">' + (pc.sifre || "-") + '</div></div>' +
      '<div class="satir"><div class="etiket">Bit Broker</div><div class="deger">' + (pc.bitBroker || "-") + '</div></div>';
  }).catch(() => {
    kart.innerHTML = '<div class="hata">❌ Veri yüklenemedi.<br>İnternet bağlantısını kontrol edin.</div>';
  });
}

/* ================= ADMIN ================= */
let veri = null;
let aktifPc = null;

function adminEkrani() {
  const tokenVar = !!localStorage.getItem(TOKEN_KEY);
  kok.innerHTML =
    '<div class="admin-kap">' +
      '<div class="giris-kutu" id="girisKutu">' +
        '<h1>🔒 Admin Girişi</h1>' +
        '<input type="password" id="sifreGiris" placeholder="Şifre" inputmode="numeric" />' +
        '<button onclick="girisYap()">Giriş Yap</button>' +
      '</div>' +
      '<div id="anaPanel" class="gizli" style="display:flex;flex-direction:column;height:100%;">' +
        '<div class="admin-baslik">💻 PC Seç</div>' +
        '<div class="grid" id="grid"></div>' +
        '<button class="btn btn-ikincil" onclick="tokenSifirla()" style="margin-top:8px;">🔑 Token\'ı Sıfırla</button>' +
      '</div>' +
      '<div id="formPanel" class="gizli"></div>' +
    '</div>';
}

function girisYap() {
  const s = document.getElementById("sifreGiris").value;
  if (s === ADMIN_SIFRE) {
    document.getElementById("girisKutu").classList.add("gizli");
    document.getElementById("anaPanel").classList.remove("gizli");
    veriYukle();
  } else { alert("Yanlış şifre!"); }
}

function veriYukle() {
  fetch("data.json?v=" + Date.now()).then(r => r.json()).then(d => {
    veri = d;
    gridCiz();
  }).catch(() => alert("Veri yüklenemedi."));
}

function gridCiz() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  veri.pcs.forEach(pc => {
    const k = document.createElement("div");
    k.className = "kutu";
    k.innerHTML = '<div class="kutu-num">' + pc.id + '</div>' +
                  '<div class="kutu-pc">' + (pc.pcAdi || "PC " + pc.id) + '</div>';
    k.onclick = () => formAc(pc.id);
    grid.appendChild(k);
  });
}

function formAc(id) {
  aktifPc = veri.pcs.find(p => p.id === id);
  document.getElementById("anaPanel").classList.add("gizli");
  const fp = document.getElementById("formPanel");
  fp.classList.remove("gizli");
  fp.innerHTML =
    '<div class="form-kap">' +
      '<div class="form-baslik">💻 PC ' + aktifPc.id + '</div>' +
      '<div class="token-kap" id="tokenKap"></div>' +
      '<label>Bilgisayar Adı</label>' +
      '<input id="f_pcAdi" value="' + (aktifPc.pcAdi || "") + '" />' +
      '<label>Kullanıcı Adı</label>' +
      '<input id="f_kullaniciAdi" value="' + (aktifPc.kullaniciAdi || "") + '" />' +
      '<label>Şifre</label>' +
      '<input id="f_sifre" value="' + (aktifPc.sifre || "") + '" />' +
      '<label>Bit Broker</label>' +
      '<input id="f_bitBroker" value="' + (aktifPc.bitBroker || "") + '" />' +
      '<div class="durum" id="durum"></div>' +
      '<div class="btn-satir">' +
        '<button class="btn btn-geri" onclick="geriDon()">← Geri</button>' +
        '<button class="btn btn-kaydet" onclick="kaydet()">💾 Kaydet</button>' +
      '</div>' +
    '</div>';
  tokenKontrol();
}

function geriDon() {
  document.getElementById("formPanel").classList.add("gizli");
  document.getElementById("formPanel").innerHTML = "";
  document.getElementById("anaPanel").classList.remove("gizli");
  gridCiz();
}

function tokenKontrol() {
  const kap = document.getElementById("tokenKap");
  if (!kap) return;
  if (localStorage.getItem(TOKEN_KEY)) { kap.classList.add("gizli"); return; }
  kap.classList.remove("gizli");
  kap.innerHTML =
    '<div style="font-size:12px;color:#a89a78;font-weight:700;margin-bottom:6px;">GitHub Token (ilk seferde gerekli)</div>' +
    '<input type="password" id="token" placeholder="github_pat_..." />' +
    '<button class="btn btn-ikincil" style="width:100%;" onclick="tokenKaydet()">Token\'ı Kaydet</button>';
}
function tokenKaydet() {
  const t = document.getElementById("token").value.trim();
  if (!t) { alert("Token boş!"); return; }
  localStorage.setItem(TOKEN_KEY, t);
  document.getElementById("tokenKap").classList.add("gizli");
  alert("Token kaydedildi.");
}
function tokenSifirla() {
  localStorage.removeItem(TOKEN_KEY);
  alert("Token silindi. Bir sonraki kayıtta yeniden girmen gerekir.");
}

function kaydet() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) { alert("Önce GitHub token gir!"); return; }

  aktifPc.pcAdi = document.getElementById("f_pcAdi").value;
  aktifPc.kullaniciAdi = document.getElementById("f_kullaniciAdi").value;
  aktifPc.sifre = document.getElementById("f_sifre").value;
  aktifPc.bitBroker = document.getElementById("f_bitBroker").value;

  const url = "https://api.github.com/repos/" + REPO + "/contents/" + DOSYA;
  durumGoster("⏳ Kaydediliyor...", "");

  fetch(url, { headers: { "Authorization": "token " + token } })
    .then(r => r.json()).then(mevcut => {
      const sha = mevcut.sha;
      const icerik = btoa(unescape(encodeURIComponent(JSON.stringify(veri, null, 2))));
      return fetch(url, {
        method: "PUT",
        headers: { "Authorization": "token " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "PC " + aktifPc.id + " güncellendi", content: icerik, sha: sha })
      });
    })
    .then(r => r.json())
    .then(sonuc => {
      if (sonuc.content) {
        durumGoster("✅ Kaydedildi! 1-2 dk içinde herkes görür.", "ok");
        setTimeout(geriDon, 1500);
      } else {
        durumGoster("❌ Hata: " + (sonuc.message || "Bilinmeyen"), "hata");
      }
    })
    .catch(e => durumGoster("❌ Bağlantı hatası: " + e.message, "hata"));
}

function durumGoster(mesaj, tip) {
  const d = document.getElementById("durum");
  if (!d) return;
  d.textContent = mesaj;
  d.className = "durum " + tip;
  if (tip !== "ok") setTimeout(() => { d.className = "durum"; }, 5000);
}
</script>
</body>
</html>
