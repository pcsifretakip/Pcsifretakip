<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC Bilgileri</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .kart {
    background: #1e293b;
    border-radius: 16px;
    padding: 22px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid #334155;
  }
  .baslik {
    font-size: 32px;
    font-weight: 800;
    color: #38bdf8;
    margin-bottom: 22px;
    text-align: center;
    padding-bottom: 18px;
    border-bottom: 2px solid #334155;
  }
  .satir {
    background: #0f172a;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
    border-left: 5px solid #38bdf8;
  }
  .etiket {
    font-size: 15px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .deger {
    font-size: 30px;
    color: #f1f5f9;
    word-break: break-all;
    font-weight: 700;
    line-height: 1.2;
  }
  .hata { text-align: center; color: #f87171; padding: 40px 20px; font-size: 20px; }
  .yukleniyor { text-align: center; padding: 40px; color: #94a3b8; font-size: 18px; }

  /* ADMIN TARAFI */
  .admin-kutu {
    max-width: 600px;
    width: 100%;
    background: #1e293b;
    border-radius: 16px;
    padding: 24px;
    border: 1px solid #334155;
  }
  .admin-kutu h1 { color: #38bdf8; font-size: 22px; margin-bottom: 20px; text-align: center; }
  .admin-kutu input, .admin-kutu button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 15px;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .admin-kutu button {
    background: #38bdf8;
    color: #0f172a;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }
  .admin-kutu button:active { opacity: 0.8; }
  .admin-kutu button.ikincil { background: #334155; color: #e2e8f0; }
  .pc-kart {
    background: #0f172a;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
    border-left: 4px solid #38bdf8;
  }
  .pc-kart h3 { color: #38bdf8; margin-bottom: 12px; font-size: 16px; }
  .pc-kart label {
    font-size: 11px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 4px;
    margin-top: 8px;
  }
  .durum {
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    font-size: 14px;
    display: none;
  }
  .durum.ok { background: #14532d; color: #86efac; display: block; }
  .durum.hata { background: #7f1d1d; color: #fca5a5; display: block; }
  .gizli { display: none; }
  .bilgi { font-size: 12px; color: #94a3b8; margin-top: 8px; line-height: 1.5; text-align: center; }
</style>
</head>
<body>

<div id="kok"></div>

<script>
  /* ============================================================
     AYARLAR
  ============================================================ */
  const ADMIN_SIFRE = "1234";
  const REPO = "takiphacamat-coder/Pcsifretakip";
  const DOSYA = "data.json";
  const TOKEN_KEY = "gh_token_pcsifre";

  /* ============================================================
     ROUTER — hangi ekran açılacak?
  ============================================================ */
  const params = new URLSearchParams(window.location.search);
  const kok = document.getElementById("kok");

  if (params.has("admin")) {
    adminEkrani();
  } else {
    kullaniciEkrani();
  }

  /* ============================================================
     KULLANICI EKRANI
  ============================================================ */
  function kullaniciEkrani() {
    const pcId = parseInt(params.get("pc"));

    kok.innerHTML = '<div class="kart"><div class="yukleniyor">Yükleniyor...</div></div>';
    const kart = kok.querySelector(".kart");

    if (!pcId || pcId < 1 || pcId > 9) {
      kart.innerHTML = '<div class="hata">❌ Geçersiz PC numarası.<br>QR kodu tekrar okutun.</div>';
      return;
    }

    fetch("data.json?v=" + Date.now())
      .then(r => r.json())
      .then(data => {
        const pc = data.pcs.find(p => p.id === pcId);
        if (!pc) { kart.innerHTML = '<div class="hata">❌ PC bulunamadı.</div>'; return; }
        kart.innerHTML = `
          <div class="baslik">💻 ${pc.pcAdi || "PC " + pc.id}</div>
          <div class="satir">
            <div class="etiket">Bilgisayar Adı</div>
            <div class="deger">${pc.pcAdi || "-"}</div>
          </div>
          <div class="satir">
            <div class="etiket">Kullanıcı Adı</div>
            <div class="deger">${pc.kullaniciAdi || "-"}</div>
          </div>
          <div class="satir">
            <div class="etiket">Şifre</div>
            <div class="deger">${pc.sifre || "-"}</div>
          </div>
          <div class="satir">
            <div class="etiket">Bit Broker</div>
            <div class="deger">${pc.bitBroker || "-"}</div>
          </div>
        `;
      })
      .catch(() => {
        kart.innerHTML = '<div class="hata">❌ Veri yüklenemedi.<br>İnternet bağlantısını kontrol edin.</div>';
      });
  }

  /* ============================================================
     ADMIN EKRANI
  ============================================================ */
  function adminEkrani() {
    kok.innerHTML = `
      <div class="admin-kutu">
        <div id="giris">
          <h1>🔒 Admin Girişi</h1>
          <input type="password" id="sifreGiris" placeholder="Şifre" />
          <button onclick="girisYap()">Giriş Yap</button>
          <div class="bilgi">Sadece yönetici girişi yapabilir.</div>
        </div>
        <div id="panel" class="gizli">
          <h1>⚙️ PC Bilgileri Yönetimi</h1>
          <div id="tokenAlani">
            <label style="font-size:12px;color:#94a3b8;display:block;margin-bottom:6px;">
              GitHub Token (sadece ilk seferde gerekli)
            </label>
            <input type="password" id="token" placeholder="github_pat_..." />
            <button onclick="tokenKaydet()">Token'ı Kaydet</button>
            <div class="bilgi">Token sadece bu telefonda saklanır.</div>
          </div>
          <button class="ikincil" onclick="tokenSifirla()" style="margin-top:10px;">Token'ı Sıfırla</button>
          <hr style="border:1px solid #334155;margin:20px 0;">
          <div id="pcListesi"></div>
          <div class="durum" id="durum"></div>
          <button onclick="kaydet()" style="margin-top:16px;">💾 Tümünü Kaydet</button>
          <button class="ikincil" onclick="veriYukle()" style="margin-top:8px;">🔄 Yenile</button>
        </div>
      </div>
    `;
  }

  let veri = null;

  function girisYap() {
    const s = document.getElementById("sifreGiris").value;
    if (s === ADMIN_SIFRE) {
      document.getElementById("giris").classList.add("gizli");
      document.getElementById("panel").classList.remove("gizli");
      tokenKontrol();
      veriYukle();
    } else { alert("Yanlış şifre!"); }
  }

  function tokenKontrol() {
    const t = localStorage.getItem(TOKEN_KEY);
    if (t) document.getElementById("tokenAlani").classList.add("gizli");
  }
  function tokenKaydet() {
    const t = document.getElementById("token").value.trim();
    if (!t) { alert("Token boş!"); return; }
    localStorage.setItem(TOKEN_KEY, t);
    document.getElementById("tokenAlani").classList.add("gizli");
    alert("Token kaydedildi.");
  }
  function tokenSifirla() {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById("tokenAlani").classList.remove("gizli");
    alert("Token silindi.");
  }

  function veriYukle() {
    fetch("data.json?v=" + Date.now())
      .then(r => r.json())
      .then(d => { veri = d; pcListesiCiz(); })
      .catch(() => alert("Veri yüklenemedi."));
  }

  function pcListesiCiz() {
    const alan = document.getElementById("pcListesi");
    alan.innerHTML = "";
    veri.pcs.forEach((pc, i) => {
      alan.innerHTML += `
        <div class="pc-kart">
          <h3>💻 PC ${pc.id}</h3>
          <label>Bilgisayar Adı</label>
          <input data-i="${i}" data-f="pcAdi" value="${pc.pcAdi || ""}" />
          <label>Kullanıcı Adı</label>
          <input data-i="${i}" data-f="kullaniciAdi" value="${pc.kullaniciAdi || ""}" />
          <label>Şifre</label>
          <input data-i="${i}" data-f="sifre" value="${pc.sifre || ""}" />
          <label>Bit Broker</label>
          <input data-i="${i}" data-f="bitBroker" value="${pc.bitBroker || ""}" />
        </div>
      `;
    });
  }

  function kaydet() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { alert("Önce GitHub token gir!"); return; }

    document.querySelectorAll("#pcListesi input").forEach(inp => {
      const i = parseInt(inp.dataset.i);
      const f = inp.dataset.f;
      veri.pcs[i][f] = inp.value;
    });

    const url = `https://api.github.com/repos/${REPO}/contents/${DOSYA}`;

    fetch(url, { headers: { "Authorization": "token " + token } })
      .then(r => r.json())
      .then(mevcut => {
        const sha = mevcut.sha;
        const icerik = btoa(unescape(encodeURIComponent(JSON.stringify(veri, null, 2))));
        return fetch(url, {
          method: "PUT",
          headers: {
            "Authorization": "token " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "PC bilgileri güncellendi",
            content: icerik,
            sha: sha
          })
        });
      })
      .then(r => r.json())
      .then(sonuc => {
        if (sonuc.content) durumGoster("✅ Kaydedildi! 1-2 dakika içinde herkes görür.", "ok");
        else durumGoster("❌ Hata: " + (sonuc.message || "Bilinmeyen hata"), "hata");
      })
      .catch(e => durumGoster("❌ Bağlantı hatası: " + e.message, "hata"));
  }

  function durumGoster(mesaj, tip) {
    const d = document.getElementById("durum");
    d.textContent = mesaj;
    d.className = "durum " + tip;
    setTimeout(() => { d.className = "durum"; }, 5000);
  }
</script>

</body>
</html>
